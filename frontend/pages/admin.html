<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard — MARQUEE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="navbar">
    <div class="container inner">
      <a href="/" class="brand">MAR<span>QUEE</span></a>
      <button class="nav-toggle" type="button" aria-label="Menu">☰</button>
      <nav class="nav-links">
        <a href="/">Home</a>
        <a href="/admin" class="active">Admin</a>
        <span data-auth-slot></span>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="section-header" style="padding-top:1.5rem">
      <div>
        <h1>Admin Dashboard</h1>
        <p class="muted">Manage movies, theatres, shows, and bookings</p>
      </div>
    </div>

    <div class="admin-layout">
      <aside class="admin-nav" id="adminNav">
        <button type="button" class="active" data-panel="overview">Overview</button>
        <button type="button" data-panel="movies">Movies</button>
        <button type="button" data-panel="theatres">Theatres</button>
        <button type="button" data-panel="screens">Screens</button>
        <button type="button" data-panel="shows">Shows</button>
        <button type="button" data-panel="bookings">Bookings</button>
      </aside>

      <div>
        <section class="admin-panel active" id="panel-overview">
          <div class="stats-grid" id="statsGrid">
            <div class="loading"><div class="spinner"></div></div>
          </div>
          <div class="card" id="popularMovies"></div>
        </section>

        <section class="admin-panel" id="panel-movies">
          <div class="section-header">
            <h2>Movies</h2>
            <button class="btn btn-primary btn-sm" id="addMovieBtn">Add Movie</button>
          </div>
          <div id="moviesAdmin"></div>
          <form class="card" id="movieForm" style="display:none;margin-top:1rem">
            <h3 id="movieFormTitle">Add Movie</h3>
            <input type="hidden" id="movieId" />
            <div class="form-row">
              <div class="form-group"><label>Title</label><input class="input" id="mTitle" required /></div>
              <div class="form-group"><label>Language</label><input class="input" id="mLang" required /></div>
            </div>
            <div class="form-group"><label>Description</label><textarea class="textarea" id="mDesc" required></textarea></div>
            <div class="form-row">
              <div class="form-group"><label>Genres (comma-separated)</label><input class="input" id="mGenre" required /></div>
              <div class="form-group"><label>Duration (min)</label><input class="input" id="mDuration" type="number" min="1" required /></div>
            </div>
            <div class="form-row">
              <div class="form-group"><label>Rating</label><input class="input" id="mRating" type="number" min="0" max="10" step="0.1" required /></div>
              <div class="form-group"><label>Release Date</label><input class="input" id="mRelease" type="date" required /></div>
            </div>
            <div class="form-row">
              <div class="form-group"><label>Poster URL</label><input class="input" id="mPoster" required /></div>
              <div class="form-group"><label>Banner URL</label><input class="input" id="mBanner" required /></div>
            </div>
            <div class="form-group">
              <label>Status</label>
              <select class="select" id="mStatus">
                <option value="now_showing">Now Showing</option>
                <option value="coming_soon">Coming Soon</option>
              </select>
            </div>
            <button class="btn btn-primary" type="submit">Save Movie</button>
            <button class="btn btn-ghost" type="button" id="cancelMovieForm">Cancel</button>
          </form>
        </section>

        <section class="admin-panel" id="panel-theatres">
          <div class="section-header">
            <h2>Theatres</h2>
            <button class="btn btn-primary btn-sm" id="addTheatreBtn">Add Theatre</button>
          </div>
          <div id="theatresAdmin"></div>
          <form class="card" id="theatreForm" style="display:none;margin-top:1rem">
            <h3>Add Theatre</h3>
            <div class="form-group"><label>Name</label><input class="input" id="tName" required /></div>
            <div class="form-group"><label>Address</label><input class="input" id="tAddress" required /></div>
            <div class="form-group"><label>City</label><input class="input" id="tCity" required /></div>
            <button class="btn btn-primary" type="submit">Save Theatre</button>
          </form>
        </section>

        <section class="admin-panel" id="panel-screens">
          <div class="section-header">
            <h2>Screens & Seats</h2>
          </div>
          <div id="screensAdmin"></div>
          <form class="card" id="screenForm" style="margin-top:1rem">
            <h3>Add Screen (with default layout)</h3>
            <div class="form-group">
              <label>Theatre</label>
              <select class="select" id="sTheatre" required></select>
            </div>
            <div class="form-group"><label>Screen Name</label><input class="input" id="sName" required placeholder="Screen 3" /></div>
            <button class="btn btn-primary" type="submit">Create Screen + Seats</button>
          </form>
        </section>

        <section class="admin-panel" id="panel-shows">
          <div class="section-header">
            <h2>Shows</h2>
          </div>
          <div id="showsAdmin"></div>
          <form class="card" id="showForm" style="margin-top:1rem">
            <h3>Schedule Show</h3>
            <div class="form-row">
              <div class="form-group"><label>Movie</label><select class="select" id="shMovie" required></select></div>
              <div class="form-group"><label>Screen</label><select class="select" id="shScreen" required></select></div>
            </div>
            <div class="form-row">
              <div class="form-group"><label>Date</label><input class="input" id="shDate" type="date" required /></div>
              <div class="form-group"><label>Start Time (HH:MM)</label><input class="input" id="shTime" pattern="^([01]\\d|2[0-3]):[0-5]\\d$" placeholder="18:30" required /></div>
            </div>
            <div class="form-row">
              <div class="form-group"><label>Regular ₹</label><input class="input" id="shRegular" type="number" min="0" value="180" required /></div>
              <div class="form-group"><label>Premium ₹</label><input class="input" id="shPremium" type="number" min="0" value="250" required /></div>
            </div>
            <div class="form-group"><label>Recliner ₹</label><input class="input" id="shRecliner" type="number" min="0" value="350" required /></div>
            <button class="btn btn-primary" type="submit">Create Show + Inventory</button>
          </form>
        </section>

        <section class="admin-panel" id="panel-bookings">
          <div class="section-header">
            <h2>All Bookings</h2>
            <button class="btn btn-secondary btn-sm" id="refreshBookingsBtn">Refresh</button>
          </div>
          <div id="bookingsAdmin"></div>
        </section>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
