<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — MARQUEE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="navbar">
    <div class="container inner">
      <a href="/" class="brand">MAR<span>QUEE</span></a>
      <nav class="nav-links">
        <a href="/register">Sign Up</a>
      </nav>
    </div>
  </header>

  <div class="auth-shell">
    <div class="card auth-card">
      <h1>Welcome back</h1>
      <p class="muted" style="margin-bottom:1.25rem">Log in to book seats and manage tickets.</p>
      <div id="alert"></div>
      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input class="input" id="email" name="email" type="email" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input class="input" id="password" name="password" type="password" required autocomplete="current-password" />
        </div>
        <button class="btn btn-primary btn-block" type="submit">Login</button>
      </form>
      <p class="auth-footer">No account? <a href="/register">Create one</a></p>
      <p class="demo-note" style="margin-top:1rem">Demo: user@cinebook.local / User@12345 · Admin from seed script</p>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/auth-pages.js"></script>
</body>
</html>
