<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — MARQUEE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="navbar">
    <div class="container inner">
      <a href="/" class="brand">MAR<span>QUEE</span></a>
      <nav class="nav-links">
        <a href="/login">Login</a>
      </nav>
    </div>
  </header>

  <div class="auth-shell">
    <div class="card auth-card">
      <h1>Create account</h1>
      <p class="muted" style="margin-bottom:1.25rem">Join MARQUEE and start booking.</p>
      <div id="alert"></div>
      <form id="registerForm">
        <div class="form-group">
          <label for="name">Name</label>
          <input class="input" id="name" name="name" type="text" required minlength="2" />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input class="input" id="email" name="email" type="email" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input class="input" id="password" name="password" type="password" required minlength="6" autocomplete="new-password" />
        </div>
        <button class="btn btn-primary btn-block" type="submit">Sign Up</button>
      </form>
      <p class="auth-footer">Already have an account? <a href="/login">Login</a></p>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/auth-pages.js"></script>
</body>
</html>
